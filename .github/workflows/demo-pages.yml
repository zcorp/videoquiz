name: Deploy Video Quiz demo to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/demo/**'
      - 'frontend/vite.demo.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build demo
        working-directory: frontend
        env:
          # The custom domain videoquiz.fr serves the site from the root path.
          DEMO_BASE_PATH: /
        run: npm ci && npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/demo-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4